<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#062b28"/>
      <stop offset="100%" stop-color="#04161c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#1d8a82" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#04161c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e2b6"/>
      <stop offset="50%" stop-color="#e9c97f"/>
      <stop offset="100%" stop-color="#c9a94e"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9c97f"/>
      <stop offset="100%" stop-color="#a08030"/>
    </linearGradient>
  </defs>

  <rect width="192" height="192" rx="36" fill="url(#bg)"/>
  <rect width="192" height="192" rx="36" fill="url(#glow)"/>

  <!-- Subtle pattern -->
  <g opacity="0.04" stroke="#e9c97f" stroke-width="0.5" fill="none">
    <circle cx="96" cy="96" r="68"/>
    <circle cx="96" cy="96" r="52"/>
    <circle cx="96" cy="96" r="36"/>
  </g>

  <!-- Mosque dome -->
  <path d="M56 128 Q56 83 96 60 Q136 83 136 128 Z" fill="url(#gold)" opacity="0.9"/>
  <path d="M68 128 Q68 92 96 72 Q114 83 118 98 Q106 86 96 80 Q82 86 76 98 Q80 83 68 128 Z" fill="#f3e2b6" opacity="0.15"/>

  <!-- Dome base -->
  <rect x="56" y="126" width="80" height="16" rx="2" fill="url(#goldDark)" opacity="0.85"/>
  <rect x="53" y="140" width="86" height="6" rx="1.5" fill="url(#goldDark)" opacity="0.7"/>

  <!-- Door arch -->
  <path d="M87 143 L87 128 Q96 120 105 128 L105 143 Z" fill="#04161c" opacity="0.5"/>

  <!-- Crescent finial -->
  <line x1="96" y1="64" x2="96" y2="52" stroke="url(#gold)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="96" cy="49" r="4" fill="url(#gold)"/>
  <circle cx="97" cy="48.3" r="3" fill="#04161c"/>

  <!-- Left minaret -->
  <rect x="42" y="98" width="10" height="48" rx="1.5" fill="url(#goldDark)" opacity="0.75"/>
  <path d="M42 98 Q47 90 52 98 Z" fill="url(#gold)" opacity="0.8"/>
  <rect x="39" y="109" width="16" height="2" rx="1" fill="url(#goldDark)" opacity="0.6"/>
  <line x1="47" y1="93" x2="47" y2="88" stroke="url(#gold)" stroke-width="1" stroke-linecap="round"/>
  <circle cx="47" cy="86" r="1.8" fill="url(#gold)"/>
  <circle cx="47.7" cy="85.5" r="1.3" fill="#04161c"/>

  <!-- Right minaret -->
  <rect x="140" y="98" width="10" height="48" rx="1.5" fill="url(#goldDark)" opacity="0.75"/>
  <path d="M140 98 Q145 90 150 98 Z" fill="url(#gold)" opacity="0.8"/>
  <rect x="137" y="109" width="16" height="2" rx="1" fill="url(#goldDark)" opacity="0.6"/>
  <line x1="145" y1="93" x2="145" y2="88" stroke="url(#gold)" stroke-width="1" stroke-linecap="round"/>
  <circle cx="145" cy="86" r="1.8" fill="url(#gold)"/>
  <circle cx="145.7" cy="85.5" r="1.3" fill="#04161c"/>

  <!-- Stars -->
  <g fill="#e9c97f">
    <circle cx="38" cy="42" r="0.8" opacity="0.4"/>
    <circle cx="158" cy="34" r="0.6" opacity="0.35"/>
    <circle cx="30" cy="68" r="0.6" opacity="0.3"/>
    <circle cx="166" cy="64" r="0.8" opacity="0.4"/>
    <circle cx="60" cy="30" r="0.6" opacity="0.3"/>
    <circle cx="136" cy="26" r="0.7" opacity="0.35"/>
  </g>
</svg>
